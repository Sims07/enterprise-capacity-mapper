name: Cypress coverage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      # Keep coverage tooling ephemeral so the production dependency tree and lockfile stay unchanged.
      - name: Install coverage tooling
        run: npm install --no-save --legacy-peer-deps @cypress/code-coverage vite-plugin-istanbul

      - name: Build instrumented application
        run: npm run build
        env:
          COVERAGE: 'true'

      # Simulate the repository subpath used by GitHub Pages so path-specific Cypress specs load their assets.
      - name: Mirror build under the GitHub Pages repository path
        run: |
          mkdir -p dist/enterprise-capacity-mapper
          find dist -mindepth 1 -maxdepth 1 ! -name enterprise-capacity-mapper -exec cp -R {} dist/enterprise-capacity-mapper/ \\\;

      - name: Start preview server
        run: npm run preview -- --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &

      - name: Wait for preview server
        run: npx --yes wait-on http://127.0.0.1:4173

      - name: Run Cypress and collect coverage
        run: npx cypress run --config defaultCommandTimeout=10000
        env:
          COVERAGE: 'true'

      - name: Generate HTML and text coverage reports
        if: always()
        run: |
          npx --yes nyc report --reporter=text-summary --reporter=html --reporter=lcov
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-line-coverage
          path: |
            coverage/
            .nyc_output/
          if-no-files-found: warn
          retention-days: 14
