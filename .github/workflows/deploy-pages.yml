name: Deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Increment PWA version after merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm version patch --no-git-tag-version
          VERSION="$(node -p 'require(\"./package.json\").version')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump PWA version to v${VERSION} [skip ci]"
          git push
      - run: npm install
      - name: Set build version
        run: echo "VITE_APP_VERSION=$(node -p 'require(\"./package.json\").version')-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Prepare GitHub Pages preview paths
        run: |
          mkdir -p /tmp/github-pages-preview/enterprise-capacity-mapper
          cp -a dist/. /tmp/github-pages-preview/
          cp -a dist/. /tmp/github-pages-preview/enterprise-capacity-mapper/
      - name: Start preview server
        run: npm run preview -- --outDir /tmp/github-pages-preview --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
      - name: Wait for preview server
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/enterprise-capacity-mapper/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Create a GitHub Release for this deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require(\"./package.json\").version')-build.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
