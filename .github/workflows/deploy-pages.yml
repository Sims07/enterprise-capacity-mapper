name: Deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Install and cache shared dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install project dependencies
        run: npm install
      - name: Install coverage tooling
        run: npm install --no-save --legacy-peer-deps @cypress/code-coverage istanbul-lib-instrument
      - name: Upload shared dependencies
        uses: actions/upload-artifact@v4
        with:
          name: node-dependencies
          path: |
            node_modules/
            ~/.cache/Cypress/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    needs: dependencies
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Increment PWA version after merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm version patch --no-git-tag-version
          VERSION="$(node -p 'require("./package.json").version')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export VERSION
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'public/sw.js';
          const source = fs.readFileSync(path, 'utf8');
          const cacheVersion = `ecm-v${process.env.VERSION}`;
          const updated = source.replace(/^const CACHE='[^']+';/m, `const CACHE='${cacheVersion}';`);
          if (updated === source && !source.includes(`const CACHE='${cacheVersion}';`)) {
            throw new Error('Could not update the PWA service worker cache version');
          }
          fs.writeFileSync(path, updated);
          NODE
          git add package.json package-lock.json public/sw.js
          git commit -m "chore: bump PWA and cache version to v${VERSION} [skip ci]"
          git push
      - name: Install project dependencies
        run: npm install
      - name: Run deterministic unit tests
        run: npm run test:unit
      - name: Run TypeScript typecheck
        run: npm run typecheck
      - name: Install coverage tooling
        run: npm install --no-save --legacy-peer-deps @cypress/code-coverage istanbul-lib-instrument
      - name: Upload shared dependencies
        uses: actions/upload-artifact@v4
        with:
          name: node-dependencies
          path: |
            node_modules/
            ~/.cache/Cypress/
          include-hidden-files: true
          retention-days: 1
      - name: Set build version
        run: echo "VITE_APP_VERSION=$(node -p 'require("./package.json").version')-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Build instrumented application for coverage
        run: npm run build -- --outDir dist-coverage
        env:
          COVERAGE: 'true'
          VITE_COVERAGE: 'true'
          CYPRESS_COVERAGE: 'true'
      - name: Upload instrumented application
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-app
          path: dist-coverage/
          retention-days: 1
      - name: Build production application
        run: npm run build
        env:
          COVERAGE: 'false'
          VITE_COVERAGE: 'false'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  cypress:
    name: Cypress shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: [build, dependencies]
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            specs: cypress/e2e/app.cy.js
          - shard: 2
            specs: cypress/e2e/cartographer-companion.cy.js,cypress/e2e/cartography-creation-coverage.cy.js,cypress/e2e/coverage.cy.js,cypress/e2e/dark-impact.cy.js
          - shard: 3
            specs: cypress/e2e/dark-mode-contrast.cy.js,cypress/e2e/dashboard.cy.js,cypress/e2e/design-tokens.cy.js,cypress/e2e/domain-description.cy.js
          - shard: 4
            specs: cypress/e2e/header-tools-wizard.cy.js,cypress/e2e/impact-summary.cy.js,cypress/e2e/import-export-library.cy.js,cypress/e2e/json-import-integrity.cy.js
          - shard: 5
            specs: cypress/e2e/analysis-integrity.cy.js,cypress/e2e/analysis-navigation-scroll.cy.js,cypress/e2e/navigation-rationalization.cy.js,cypress/e2e/relations-dark-hover.cy.js,cypress/e2e/relations.cy.js,cypress/e2e/resilience-pwa.cy.js,cypress/e2e/wizard-theme.cy.js
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Download shared dependencies
        uses: actions/download-artifact@v4
        with:
          name: node-dependencies
          path: .
      - name: Download instrumented application
        uses: actions/download-artifact@v4
        with:
          name: instrumented-app
          path: dist-coverage
      - name: Start instrumented static preview
        run: |
          npx vite preview --host 127.0.0.1 --port 4173 --strictPort --outDir dist-coverage --base /enterprise-capacity-mapper/ > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
      - name: Wait for instrumented static preview
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/enterprise-capacity-mapper/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo 'Instrumented Vite preview did not become ready.'
          cat /tmp/vite-preview.log
          exit 1
      - name: Run assigned Cypress specs
        run: |
          mkdir -p "/tmp/cypress-timing"
          START="$(date +%s)"
          set +e
          npx cypress run --config defaultCommandTimeout=10000 --spec "${{ matrix.specs }}"
          RESULT=$?
          END="$(date +%s)"
          echo "Shard ${{ matrix.shard }} elapsed seconds: $((END - START)); exit code: $RESULT" | tee "/tmp/cypress-timing/shard-${{ matrix.shard }}.txt"
          exit "$RESULT"
        env:
          COVERAGE: 'true'
          VITE_COVERAGE: 'true'
          CYPRESS_COVERAGE: 'true'
      - name: Diagnose Vite instrumentation output
        if: failure()
        run: |
          echo '--- Vite preview log ---'
          cat /tmp/vite-preview.log || true
          echo '--- Instrumentation marker summary ---'
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir = 'dist-coverage/assets';
          const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter(file => /\.js$/.test(file)) : [];
          const results = files.map(file => {
            const source = fs.readFileSync(path.join(dir, file), 'utf8');
            return { file, hasCoverageMap: source.includes('__coverage__'), hasCounters: /s\[\d+\]\+\+/.test(source) };
          });
          console.log(JSON.stringify(results, null, 2));
          if (!results.some(result => result.hasCoverageMap && result.hasCounters)) {
            console.error('No instrumented JavaScript bundle was available to inspect.');
          }
          NODE
      - name: Upload shard coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-coverage-${{ matrix.shard }}
          path: |
            .nyc_output/
            coverage/.nyc_output/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload shard timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-timing-${{ matrix.shard }}
          path: /tmp/cypress-timing/
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop instrumented Vite server
        if: always()
        run: |
          if [ -f /tmp/vite-preview.pid ]; then
            kill "$(cat /tmp/vite-preview.pid)" 2>/dev/null || true
          fi

  coverage:
    name: Merge Cypress coverage
    runs-on: ubuntu-latest
    needs: [cypress, dependencies]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Download shared dependencies
        uses: actions/download-artifact@v4
        with:
          name: node-dependencies
          path: .
      - name: Download coverage from all shards
        uses: actions/download-artifact@v4
        with:
          pattern: cypress-coverage-*
          path: downloaded-coverage
      - name: Verify and merge Istanbul coverage maps
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const sourceRoot = 'downloaded-coverage';
          const targetRoot = '.nyc_output';
          fs.mkdirSync(targetRoot, { recursive: true });
          const files = [];
          function visit(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const fullPath = path.join(dir, entry.name);
              if (entry.isDirectory()) visit(fullPath);
              else if (entry.name.endsWith('.json')) files.push(fullPath);
            }
          }
          visit(sourceRoot);
          console.log('Downloaded coverage artifact contents:', files.length ? files.join('\\n') : '(no JSON files found)');
          let copied = 0;
          for (const file of files) {
            try {
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              if (!data || typeof data !== 'object' || Object.keys(data).length === 0) continue;
              const shard = file.match(/cypress-coverage-(\\d+)/)?.[1] ?? 'unknown';
              const destination = path.join(targetRoot, `shard-${shard}-${copied}.json`);
              fs.copyFileSync(file, destination);
              copied += 1;
            } catch {
              // Ignore non-JSON or malformed artifact files; fail below if no valid map remains.
            }
          }
          if (copied === 0) {
            console.error('No non-empty Istanbul coverage maps were uploaded by the Cypress shards.');
            process.exit(1);
          }
          console.log(`Collected ${copied} coverage map(s) without overwriting maps from other shards.`);
          NODE
          npx --yes nyc merge .nyc_output coverage-merged.json
          mkdir -p .nyc_output-merged
          mv coverage-merged.json .nyc_output-merged/coverage.json
      - name: Generate global HTML and text coverage reports
        run: npx --yes nyc report --temp-dir .nyc_output-merged --reporter=text-summary --reporter=html --reporter=lcov --reporter=json-summary
      - name: Upload global coverage report
        uses: actions/upload-artifact@v4
        with:
          name: cypress-line-coverage
          path: |
            coverage/
            .nyc_output-merged/
          if-no-files-found: error
          retention-days: 14
      - name: Publish Cypress line coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const summaryPath = 'coverage/coverage-summary.json';
          if (!fs.existsSync(summaryPath)) {
            throw new Error(`Missing ${summaryPath}; refusing to publish a misleading coverage badge.`);
          }
          const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          const lines = summary.total?.lines;
          if (!lines || !Number.isFinite(lines.pct) || lines.total <= 0) {
            throw new Error('Coverage summary has no valid line coverage percentage.');
          }
          const percentage = Math.round(lines.pct * 10) / 10;
          const color = percentage >= 80 ? 'brightgreen' : percentage >= 60 ? 'yellow' : 'red';
          fs.writeFileSync('/tmp/coverage.json', JSON.stringify({ schemaVersion: 1, label: 'line coverage', message: `${percentage}%`, color }, null, 2) + '\n');
          console.log(`Publishing line coverage badge: ${percentage}%`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan coverage-badge
          git rm -rf .
          cp /tmp/coverage.json coverage.json
          git add coverage.json
          git commit -m "chore: update Cypress line coverage badge"
          git push --force origin coverage-badge

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, cypress, coverage]
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Create a GitHub Release for this deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')-build.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
