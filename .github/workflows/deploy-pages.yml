name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Increment PWA version after merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git pull --rebase origin main
          npm version patch --no-git-tag-version
          VERSION="$(node -p 'require("./package.json").version')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export VERSION
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'src/sw.ts';
          const source = fs.readFileSync(path, 'utf8');
          const cacheVersion = `ecm-v${process.env.VERSION}`;
          const updated = source.replace(/^const CACHE = '[^']+';/m, `const CACHE = '${cacheVersion}';`);
          if (updated === source && !source.includes(`const CACHE='${cacheVersion}';`)) {
            throw new Error('Could not update the PWA service worker cache version');
          }
          fs.writeFileSync(path, updated);
          NODE
          git add package.json package-lock.json src/sw.ts
          git commit -m "chore: bump PWA and cache version to v${VERSION} [skip ci]"
          git push

      - name: Install project dependencies
        run: npm install

      - name: Run unit tests with Vitest
        run: npm run test:unit

      - name: Run unit tests with source coverage
        run: npm run test:unit:coverage

      - name: Verify unit coverage report
        run: |
          test -s coverage-unit/coverage-summary.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const summary = JSON.parse(fs.readFileSync('coverage-combined/coverage-summary.json', 'utf8'));
          const lines = summary.total?.lines;
          if (!lines || !Number.isFinite(lines.pct) || lines.total <= 0) {
            throw new Error('Missing valid combined Vitest + Playwright coverage summary.');
          }
          const percentage = Math.round(lines.pct * 10) / 10;
          const color = percentage >= 80 ? 'brightgreen' : percentage >= 60 ? 'yellow' : 'red';
          fs.writeFileSync('/tmp/coverage.json', JSON.stringify({ schemaVersion: 1, label: 'combined line coverage', message: `${percentage}%`, color }, null, 2) + '\\n');
          console.log(`Publishing combined Vitest + Playwright line coverage badge: ${percentage}%`);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p badges
          cp /tmp/coverage.json badges/coverage.json
          git add badges/coverage.json
          git diff --cached --quiet || git commit -m "docs: update unit coverage badge [skip ci]"
          git push

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
