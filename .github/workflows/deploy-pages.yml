name: Deploy PWA to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Increment PWA version after merge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npm version patch --no-git-tag-version
          VERSION="$(node -p 'require("./package.json").version')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export VERSION
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'public/sw.js';
          const source = fs.readFileSync(path, 'utf8');
          const cacheVersion = `ecm-v${process.env.VERSION}`;
          const updated = source.replace(/^const CACHE='[^']+';/m, `const CACHE='${cacheVersion}';`);
          if (updated === source && !source.includes(`const CACHE='${cacheVersion}';`)) {
            throw new Error('Could not update the PWA service worker cache version');
          }
          fs.writeFileSync(path, updated);
          NODE
          git add package.json package-lock.json public/sw.js
          git commit -m "chore: bump PWA and cache version to v${VERSION} [skip ci]"
          git push
      - name: Install project dependencies
        run: npm install
      - name: Install coverage tooling
        run: npm install --no-save --legacy-peer-deps @cypress/code-coverage vite-plugin-istanbul
      - name: Set build version
        run: echo "VITE_APP_VERSION=$(node -p 'require("./package.json").version')-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      # Cypress runs once, against the instrumented build, so the same run generates both test results and coverage.
      - name: Build instrumented application
        run: npm run build
        env:
          COVERAGE: 'true'
      - name: Prepare GitHub Pages preview paths
        run: |
          mkdir -p /tmp/github-pages-preview/enterprise-capacity-mapper
          cp -a dist/. /tmp/github-pages-preview/
          cp -a dist/. /tmp/github-pages-preview/enterprise-capacity-mapper/
      - name: Start preview server
        run: |
          npm run preview -- --outDir /tmp/github-pages-preview --host 127.0.0.1 > /tmp/vite-preview.log 2>&1 &
          echo $! > /tmp/vite-preview.pid
      - name: Wait for preview server
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/enterprise-capacity-mapper/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vite-preview.log
          exit 1
      - name: Run Cypress once and collect coverage
        run: npx cypress run --config defaultCommandTimeout=10000
        env:
          COVERAGE: 'true'
      - name: Generate HTML and text coverage reports
        if: always()
        run: npx --yes nyc report --reporter=text-summary --reporter=html --reporter=lcov
        continue-on-error: true
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-line-coverage
          path: |
            coverage/
            .nyc_output/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop preview server
        if: always()
        run: |
          if [ -f /tmp/vite-preview.pid ]; then
            kill "$(cat /tmp/vite-preview.pid)" 2>/dev/null || true
          fi
      # Rebuild without instrumentation so the published PWA remains a normal production build.
      - name: Build production application
        if: success()
        run: npm run build
        env:
          COVERAGE: 'false'
      - uses: actions/upload-pages-artifact@v4
        if: success()
        with:
          path: ./dist
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Create a GitHub Release for this deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p 'require("./package.json").version')-build.${GITHUB_RUN_NUMBER}"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
