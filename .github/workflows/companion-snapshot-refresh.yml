name: Refresh companion Storybook snapshots

on:
  push:
    branches: [feat/companion-design-system]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[snapshot-update]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm install --prefix storybook-poc
      - run: npm run build --prefix storybook-poc
        env:
          STORYBOOK_BASE_PATH: /enterprise-capacity-mapper/storybook/
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.storybook.config.ts --update-snapshots
      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playwright/storybook/__screenshots__
          git diff --cached --quiet || git commit -m "test: update Storybook snapshots [snapshot-update]"
          git push
